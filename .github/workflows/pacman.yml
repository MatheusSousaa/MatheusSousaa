name: Generate Pac-Man Contribution Graph

on:
  schedule:
    # Executa todo dia à meia-noite (gera o commit diário automático)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: MatheusSousaa

      - name: Push new graphics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
