<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', Roboto, monospace;
        font-size: 30px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: 5px;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #00FF66;
        letter-spacing: 3px;
        text-anchor: middle;
      }
      .tag {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .wall {
        stroke: #1f6feb;
        stroke-width: 2;
        fill: none;
      }

      /* Single Chase Patrol: runs from left to right smoothly */
      @keyframes patrol {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(960px); }
      }

      .chase-squad {
        animation: patrol 8.5s linear infinite;
      }

      /* Pac-Man mouth chomping (scaling the mouth wedge) */
      @keyframes chomp {
        0%, 100% { transform: scaleY(0.05); }
        50% { transform: scaleY(1); }
      }

      .mouth-wedge {
        fill: #0d1117;
        transform-origin: 0px 0px;
        animation: chomp 0.22s infinite alternate ease-in-out;
      }

      /* Power pellets blink */
      @keyframes pulse {
        from { opacity: 1; }
        to { opacity: 0.2; }
      }
      .blink {
        animation: pulse 0.5s infinite alternate;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="10" stroke="#30363d" stroke-width="1.5"/>

  <!-- Neon Blue Outer Maze Frame -->
  <rect x="20" y="16" width="810" height="148" rx="8" class="wall"/>

  <!-- Corner Maze Accents -->
  <path d="M 35 32 H 95 V 60 H 35" class="wall"/>
  <path d="M 815 32 H 755 V 60 H 815" class="wall"/>

  <!-- Center Text -->
  <g transform="translate(425, 54)">
    <text y="-8" class="tag">&lt; SOFTWARE ENGINEER / BACKEND /&gt;</text>
    <text y="28" class="title">MATHEUS SOUSA</text>
    <text y="56" class="subtitle">JAVA • SPRING BOOT • POSTGRESQL • REST APIs</text>
  </g>

  <!-- Track Lane -->
  <line x1="25" y1="140" x2="825" y2="140" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Dots on Track -->
  <g fill="#ffb897" opacity="0.6">
    <circle cx="60" cy="140" r="2.5"/>
    <circle cx="100" cy="140" r="2.5"/>
    <circle cx="140" cy="140" r="2.5"/>
    <circle cx="180" cy="140" r="2.5"/>
    <circle cx="220" cy="140" r="2.5"/>
    <circle cx="260" cy="140" r="2.5"/>
    <circle cx="300" cy="140" r="2.5"/>
    <circle cx="340" cy="140" r="2.5"/>
    <circle cx="380" cy="140" r="2.5"/>
    <circle cx="420" cy="140" r="2.5"/>
    <circle cx="460" cy="140" r="2.5"/>
    <circle cx="500" cy="140" r="2.5"/>
    <circle cx="540" cy="140" r="2.5"/>
    <circle cx="580" cy="140" r="2.5"/>
    <circle cx="620" cy="140" r="2.5"/>
    <circle cx="660" cy="140" r="2.5"/>
    <circle cx="700" cy="140" r="2.5"/>
    <circle cx="740" cy="140" r="2.5"/>
    <circle cx="780" cy="140" r="2.5"/>
  </g>

  <!-- Corner Pellets -->
  <circle cx="38" cy="140" r="4.5" fill="#FFE600" class="blink"/>
  <circle cx="812" cy="140" r="4.5" fill="#FFE600" class="blink"/>

  <!-- The Chase Squad (Pacman leading, 2 ghosts chasing behind) -->
  <g class="chase-squad" transform="translate(0, 140)">
    
    <!-- Ghost 2: Inky (Cyan) - 68px behind Pacman -->
    <g transform="translate(-68, 0)">
      <path d="M -9 0 C -9 -10, 9 -10, 9 0 L 9 6 L 6 3 L 3 6 L 0 3 L -3 6 L -6 3 L -9 6 Z" fill="#00FFFF"/>
      <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF"/>
      <circle cx="4" cy="-3" r="2.5" fill="#FFFFFF"/>
      <circle cx="-2" cy="-3" r="1.3" fill="#0000FF"/>
      <circle cx="5" cy="-3" r="1.3" fill="#0000FF"/>
    </g>

    <!-- Ghost 1: Blinky (Red) - 34px behind Pacman -->
    <g transform="translate(-34, 0)">
      <path d="M -9 0 C -9 -10, 9 -10, 9 0 L 9 6 L 6 3 L 3 6 L 0 3 L -3 6 L -6 3 L -9 6 Z" fill="#FF0000"/>
      <circle cx="-3" cy="-3" r="2.5" fill="#FFFFFF"/>
      <circle cx="4" cy="-3" r="2.5" fill="#FFFFFF"/>
      <circle cx="-2" cy="-3" r="1.3" fill="#0000FF"/>
      <circle cx="5" cy="-3" r="1.3" fill="#0000FF"/>
    </g>

    <!-- Pac-Man Leading in Front (x = 0) -->
    <g transform="translate(0, 0)">
      <!-- Perfect solid yellow circle -->
      <circle cx="0" cy="0" r="11" fill="#FFE600"/>
      <!-- Mouth wedge that opens and closes forward -->
      <polygon points="0,0 13,-9 13,9" class="mouth-wedge"/>
    </g>

  </g>

</svg>