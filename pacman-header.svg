<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="210">
  <defs>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', Roboto, 'Courier New', monospace;
        font-size: 32px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #00FF66;
        letter-spacing: 3px;
        text-anchor: middle;
      }
      .tag {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }
      .wall {
        stroke: #1f6feb;
        stroke-width: 2.5;
        fill: none;
        stroke-linejoin: round;
      }
      .wall-glow {
        stroke: #1f6feb;
        stroke-width: 6;
        fill: none;
        opacity: 0.15;
      }

      /* Chomp Animation */
      @keyframes chomp-top {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-32deg); }
      }
      @keyframes chomp-bottom {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(32deg); }
      }

      .mouth-t {
        fill: #FFE600;
        transform-origin: 0 0;
        animation: chomp-top 0.22s infinite alternate;
      }
      .mouth-b {
        fill: #FFE600;
        transform-origin: 0 0;
        animation: chomp-bottom 0.22s infinite alternate;
      }

      /* Smooth Horizontal Patrol: runs from left to right smoothly */
      @keyframes smooth-patrol {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(950px); }
      }

      .pacman-group {
        animation: smooth-patrol 11s linear infinite;
      }
      .ghost-inky {
        animation: smooth-patrol 11s linear infinite;
        animation-delay: -0.45s;
      }
      .ghost-blinky {
        animation: smooth-patrol 11s linear infinite;
        animation-delay: -0.9s;
      }
      .ghost-clyde {
        animation: smooth-patrol 11s linear infinite;
        animation-delay: -1.35s;
      }

      /* Power pellet blink */
      @keyframes pulse {
        from { opacity: 1; }
        to { opacity: 0.25; }
      }
      .pellet-blink {
        animation: pulse 0.5s infinite alternate;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1.5"/>

  <!-- Maze Neon Outer Frame -->
  <rect x="25" y="20" width="800" height="170" rx="10" class="wall-glow"/>
  <rect x="25" y="20" width="800" height="170" rx="10" class="wall"/>

  <!-- Decorative Maze Corners / Accents -->
  <path d="M 45 40 H 120 V 75 H 45" class="wall"/>
  <path d="M 805 40 H 730 V 75 H 805" class="wall"/>
  <path d="M 45 135 H 120 V 170" class="wall"/>
  <path d="M 805 135 H 730 V 170" class="wall"/>

  <!-- Center Content -->
  <g transform="translate(425, 68)">
    <text y="-14" class="tag">&lt; SOFTWARE ENGINEER / BACKEND /&gt;</text>
    <text y="28" class="title">MATHEUS SOUSA</text>
    <text y="58" class="subtitle">JAVA • SPRING BOOT • POSTGRESQL • REST APIs</text>
  </g>

  <!-- Track Lane Divider -->
  <line x1="30" y1="165" x2="820" y2="165" stroke="#21262d" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Dots on track -->
  <g fill="#ffb897" opacity="0.7">
    <circle cx="70" cy="165" r="2.5"/>
    <circle cx="110" cy="165" r="2.5"/>
    <circle cx="150" cy="165" r="2.5"/>
    <circle cx="190" cy="165" r="2.5"/>
    <circle cx="230" cy="165" r="2.5"/>
    <circle cx="270" cy="165" r="2.5"/>
    <circle cx="310" cy="165" r="2.5"/>
    <circle cx="350" cy="165" r="2.5"/>
    <circle cx="390" cy="165" r="2.5"/>
    <circle cx="430" cy="165" r="2.5"/>
    <circle cx="470" cy="165" r="2.5"/>
    <circle cx="510" cy="165" r="2.5"/>
    <circle cx="550" cy="165" r="2.5"/>
    <circle cx="590" cy="165" r="2.5"/>
    <circle cx="630" cy="165" r="2.5"/>
    <circle cx="670" cy="165" r="2.5"/>
    <circle cx="710" cy="165" r="2.5"/>
    <circle cx="750" cy="165" r="2.5"/>
    <circle cx="790" cy="165" r="2.5"/>
  </g>

  <!-- Power Pellets at Ends -->
  <circle cx="48" cy="165" r="5" fill="#FFE600" class="pellet-blink"/>
  <circle cx="802" cy="165" r="5" fill="#FFE600" class="pellet-blink"/>

  <!-- Smooth Moving Characters -->
  <!-- Ghost 3: Clyde (Orange) -->
  <g class="ghost-clyde" transform="translate(0, 165)">
    <path d="M -10 0 C -10 -11, 10 -11, 10 0 L 10 7 L 6 4 L 3 7 L 0 4 L -3 7 L -6 4 L -10 7 Z" fill="#FFB847"/>
    <circle cx="-3" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="4" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="-2" cy="-3" r="1.4" fill="#0000FF"/>
    <circle cx="5" cy="-3" r="1.4" fill="#0000FF"/>
  </g>

  <!-- Ghost 2: Inky (Cyan) -->
  <g class="ghost-inky" transform="translate(0, 165)">
    <path d="M -10 0 C -10 -11, 10 -11, 10 0 L 10 7 L 6 4 L 3 7 L 0 4 L -3 7 L -6 4 L -10 7 Z" fill="#00FFFF"/>
    <circle cx="-3" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="4" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="-2" cy="-3" r="1.4" fill="#0000FF"/>
    <circle cx="5" cy="-3" r="1.4" fill="#0000FF"/>
  </g>

  <!-- Ghost 1: Blinky (Red) -->
  <g class="ghost-blinky" transform="translate(0, 165)">
    <path d="M -10 0 C -10 -11, 10 -11, 10 0 L 10 7 L 6 4 L 3 7 L 0 4 L -3 7 L -6 4 L -10 7 Z" fill="#FF0000"/>
    <circle cx="-3" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="4" cy="-3" r="2.8" fill="#FFFFFF"/>
    <circle cx="-2" cy="-3" r="1.4" fill="#0000FF"/>
    <circle cx="5" cy="-3" r="1.4" fill="#0000FF"/>
  </g>

  <!-- Pac-Man Leading -->
  <g class="pacman-group" transform="translate(0, 165)">
    <path class="mouth-t" d="M 0 0 L 12 0 A 12 12 0 0 0 -12 0 Z"/>
    <path class="mouth-b" d="M 0 0 L 12 0 A 12 12 0 0 1 -12 0 Z"/>
  </g>

</svg>